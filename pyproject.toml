[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viruswatch-backend"
version = "0.1.0"
description = "VirusWatch: AI-assisted infectious-disease surveillance backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pandas>=2.2",
  "structlog>=24.1",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests: fake credentials, SQL built from test constants, and a harness that runs psql/sed
# with arguments the test itself controls.
"tests/**" = ["S105", "S106", "S603", "S607", "S608"]
